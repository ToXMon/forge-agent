# Akash SDL for the Forge server (validated against awesome-akash templates
# and the SDL v2 reference).
#
# ⚠️ Everything in `env` is PUBLIC — SDL manifests are stored on-chain.
#    Keep placeholders here and inject real secrets at runtime, or use a
#    dedicated low-privilege API key for the deployment.
#
# Akash Console: paste this file at https://console.akash.network → Deploy.
# CLI: bash deploy/akash-deploy.sh (after funding a wallet + installing the CLI).
---
version: "2.0"
services:
  forge:
    # Pin a concrete tag — providers refuse to re-pull `latest` on restart.
    image: ghcr.io/YOUR_GH_USERNAME/forge:v0.1.0
    command:
      - "sh"
      - "-c"
      - "node dist/src/server/index.js"
    env:
      - FORGE_BASE_URL=https://openrouter.ai/api/v1
      - FORGE_API_KEY=sk-or-REPLACE-ME
      - FORGE_MODEL=deepseek/deepseek-chat-v3-0324
      - FORGE_PORT=8787
      # - FORGE_TELEGRAM_BOT_TOKEN=123:abc   # only if you want the Telegram channel
    expose:
      - port: 8787
        as: 80
        to:
          - global: true
        # Keep long-lived SSE/WebSocket connections from being cut by the
        # provider's ingress.
        http_options:
          max_body_size: 10485760
          read_timeout: 360000
          send_timeout: 360000
          next_cases: ["error", "timeout", "502", "503", "504"]
profiles:
  compute:
    forge:
      resources:
        cpu:
          units: 1
        memory:
          size: 1Gi
        storage:
          size: 1Gi
  placement:
    akash:
      # Restrict bidding to verified Akash providers.
      signedBy:
        anyOf:
          - "akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63"
      attributes:
        host: akash
      pricing:
        forge:
          denom: uakt
          amount: 10000   # upper bound — you pay the winning (lower) bid
deployment:
  forge:
    akash:
      profile: forge
      count: 1
